<ng-content select="[title]"></ng-content>
@if (chart.attributeProperties$ | async; as attributeProperties) { @if
(attributeProperties.config) { @if (attributeProperties.config.binType ===
VicValuesBin.none) {
<vic-continuous-legend
  [width]="width"
  [height]="height"
  [valuesSide]="valuesSide"
  [scale]="attributeProperties.scale"
  [config]="attributeProperties.config"
  [outlineColor]="outlineColor"
  [orientation]="orientation"
></vic-continuous-legend>
} @else {
<vic-discontinuous-legend
  [width]="width"
  [height]="height"
  [valuesSide]="valuesSide"
  [scale]="attributeProperties.scale"
  [config]="attributeProperties.config"
  [outlineColor]="outlineColor"
  [orientation]="orientation"
></vic-discontinuous-legend>
} } }
