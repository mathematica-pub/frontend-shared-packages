name: Release packages
on:
  issue_comment:
    types: [created]

  push:
    branches:
      - main
permissions:
  id-token: write
  pull-requests: write
  contents: write
  issues: write

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_VIC }}

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Update npm
        run: npm install -g npm@11.14.1
      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Print Environment Info
        run: npx nx report
        shell: bash

      - name: Build packages
        run: npx nx run-many -t build
        shell: bash

      - name: Verify tag & commit to publish is in `main`
        run: |
          # Get the current version from libs/viz/package.json (all packages share same version)
          VERSION=$(node -p "require('./libs/viz/package.json').version")
          echo "Package version: $VERSION"

          # Run dry-run and capture output to verify what would be published
          echo "Running nx release publish --dry-run..."
          DRY_RUN_OUTPUT=$(npx nx release publish --dry-run 2>&1)
          echo "$DRY_RUN_OUTPUT"

          # Check if the dry-run output mentions the version
          if echo "$DRY_RUN_OUTPUT" | grep -q "$VERSION"; then
            echo "✅ Dry-run output confirms version $VERSION will be published"
          else
            echo "::warning::Could not confirm version $VERSION in dry-run output"
          fi

          # Find all tags that contain this version
          MATCHING_TAGS=$(git tag -l "*$VERSION*")

          if [ -z "$MATCHING_TAGS" ]; then
            echo "::error::No git tag found for version $VERSION"
            echo "::error::Run 'nx release --skip-publish' to create a version tag before publishing"
            exit 1
          fi

          # Use the first matching tag
          TAG=$(echo "$MATCHING_TAGS" | head -1)
          echo "Found tag: $TAG"

          # Get the commit that the tag points to
          TAG_COMMIT=$(git rev-list -n 1 "$TAG" 2>/dev/null)

          if [ -z "$TAG_COMMIT" ]; then
            echo "::error::Could not find commit for tag $TAG"
            exit 1
          fi

          echo "Tag $TAG points to commit: ${TAG_COMMIT:0:7}"

          # Verify this commit is in main's history
          if git merge-base --is-ancestor "$TAG_COMMIT" HEAD; then
            echo "✅ Tag $TAG (commit ${TAG_COMMIT:0:7}) is in main branch history"
          else
            echo "::error::Tag $TAG (commit ${TAG_COMMIT:0:7}) is NOT in main branch history"
            echo "::error::Only commits that exist in main can be published"
            exit 1
          fi
        shell: bash

      - name: Publish packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_REGION: us-east-1
        run: npx nx release publish --access public --provenance

      - name: Get published version
        id: version
        run: |
          VERSION=$(node -p "require('./libs/viz/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Send Slack notification
        if: success()
        run: |
          if ! curl --fail-with-body -X POST -H "Content-type: application/json" --data-raw "{
            \"text\": \"📦 Packages v${{ steps.version.outputs.version }} have been published to npm!\",
            \"blocks\": [
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"📦 *Packages v${{ steps.version.outputs.version }}* have been published to npm!\"
                }
              },
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"<https://github.com/mathematica-pub/frontend-shared-packages/blob/main/CHANGELOG.md|View CHANGELOG>\"
                }
              }
            ]
          }" "${{ env.SLACK_WEBHOOK_URL }}"; then
            echo "::warning::Failed to send Slack notification, but release succeeded"
          fi
        shell: bash

  beta-release:
    if:
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, 'beta-release-bot:')
    name: Beta release package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get PR branch
        uses: xt0rted/pull-request-comment-branch@v2
        id: comment-branch

      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ steps.comment-branch.outputs.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Set referenced package
        run: |
          REFERENCED_PACKAGE=$(echo "${{ github.event.comment.body }}" | sed -n 's/.*beta-release-bot: \([^)]*\).*/\1/p')
          echo "Referenced package: $REFERENCED_PACKAGE"
          echo "REFERENCED_PACKAGE=$REFERENCED_PACKAGE" >> $GITHUB_ENV

      - name: Confirm referenced package exists
        run: |
          if [ ! -d "./libs/$REFERENCED_PACKAGE" ]; then
            echo "Error: Directory ./libs/$REFERENCED_PACKAGE does not exist."
            exit 1
          fi

      - name: Update npm
        run: npm install -g npm@11.14.1

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current beta version
        id: beta_version
        env:
          REFERENCED_PACKAGE: ${{ env.REFERENCED_PACKAGE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/get_beta_version.sh

      - name: Beta release package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_REGION: us-east-1
        run: |
          npx nx build $REFERENCED_PACKAGE
          cd dist/$REFERENCED_PACKAGE
          npm version $beta_version --no-git-tag-version
          npm publish --tag beta --access public --provenance

      - name: Add comment to PR
        uses: actions/github-script@v6
        if: always()
        with:
          script: |
            const workflow = '${{ github.workflow  }}';
            const url = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const success = '${{ job.status }}' === 'success';
            const pkg = process.env.REFERENCED_PACKAGE;
            const version = process.env.beta_version;
            let body = `[${workflow} (${pkg})](${url}): ${success ? 'Succeeded ✅' : 'Failed ❌'}`;
            if (success) {
              body = body + `\n\nTo install, run \`npm install @mathstack/${pkg}@${version}\``;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
